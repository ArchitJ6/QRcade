<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SnakeQR</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#0f0;font-family:monospace}#g{background:#000;border:3px solid #0f0}#s{margin:8px 0;text-shadow:0 0 5px #0f0}#i{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.9);text-align:center}#i h1{font-size:32px;margin:6px;color:#0f0}#i p{margin:3px;color:#ff0}</style><body><div id=s>SCORE:0|HIGH:0</div><canvas id=g></canvas><div id=i><h1>SNAKE</h1><p>Arrows/WASD</p><p>Press key</p></div><script>const c=g,x=c.getContext("2d"),hud=s,info=i,W=30,H=20,SZ=20;c.width=W*SZ;c.height=H*SZ;let snake=[],dir={x:1,y:0},nxt={x:1,y:0},food={x:10,y:10},go=0,sc=0,hi=0,spd=100,last=0;try{hi=+localStorage.hs||0}catch{}function spawn(){do food={x:~~(Math.random()*W),y:~~(Math.random()*H)};while(snake.some(p=>p.x==food.x&&p.y==food.y))}function upd(){if(!go)return;dir=nxt;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=W||h.y>=H||snake.some(p=>p.x==h.x&&p.y==h.y)){go=0;info.innerHTML=`<h1>GAME OVER</h1><p>Score:${sc}</p><p>High:${hi}</p><p>Press key</p>`;info.style.display="flex";return}snake.unshift(h);if(h.x==food.x&&h.y==food.y){sc+=10;if(sc>hi){hi=sc;try{localStorage.hs=hi}catch{}}hud.textContent=`SCORE:${sc}|HIGH:${hi}`;spawn();spd=Math.max(40,spd-2)}else snake.pop()}function draw(){x.fillStyle="#000";x.fillRect(0,0,c.width,c.height);if(!snake.length)return;x.fillStyle="#0f0";snake.forEach(p=>x.fillRect(p.x*SZ+1,p.y*SZ+1,SZ-2,SZ-2));x.fillStyle="#f00";x.beginPath();x.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2-2,0,7);x.fill()}function loop(t){go&&t-last>spd&&(upd(),last=t);draw();requestAnimationFrame(loop)}function start(){snake=[{x:15,y:10},{x:14,y:10},{x:13,y:10}];dir=nxt={x:1,y:0};sc=0;spd=100;go=1;info.style.display="none";hud.textContent=`SCORE:${sc}|HIGH:${hi}`;spawn();last=performance.now()}onkeydown=e=>{if(!go)return start();const k=e.key.toLowerCase();if((k=="arrowup"||k=="w")&&!dir.y)nxt={x:0,y:-1};else if((k=="arrowdown"||k=="s")&&!dir.y)nxt={x:0,y:1};else if((k=="arrowleft"||k=="a")&&!dir.x)nxt={x:-1,y:0};else if((k=="arrowright"||k=="d")&&!dir.x)nxt={x:1,y:0}};hud.textContent=`SCORE:${sc}|HIGH:${hi}`;requestAnimationFrame(loop);</script>
