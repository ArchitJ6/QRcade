<!DOCTYPE html><meta charset="utf-8" /><title>Flappy Smooth</title
><style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #000;
  }
  canvas {
    background: #222;
    border-radius: 10px;
  }
</style>
<canvas id="c" width="240" height="400"></canvas>
<script>
  const cv = c,
    ctx = cv.getContext("2d"),
    W = cv.width,
    H = cv.height;
  let state = 0,
    y = H / 2,
    v = 0,
    grav = 0.14,
    jump = -4.0,
    pipes = [],
    gap = 150,
    pw = 45,
    speed = 1.3,
    score = 0,
    best = 0,
    frame = 0,
    bx = 60,
    br = 10;
  pipes_diff = 120;

  function reset() {
    state = 0;
    y = H / 2;
    v = 0;
    pipes = [];
    score = 0;
    frame = 0;
  }

  function tap(e) {
    if (e) e.preventDefault();
    if (state === 0) {
      state = 1;
      v = jump;
    } else if (state === 1) {
      v = jump;
    } else reset();
  }

  cv.addEventListener("pointerdown", tap);

  function update() {
    if (state !== 1) return;

    frame++;
    v += grav;
    y += v;

    if (frame % pipes_diff === 0) {
      let top = 25 + Math.random() * (H - gap - 50);
      pipes.push({ x: W, top: top, bot: top + gap, scored: false });
    }

    for (let p of pipes) {
      p.x -= speed;

      if (!p.scored && p.x + pw < bx) {
        p.scored = true;
        score++;
      }

      if (bx + br > p.x && bx - br < p.x + pw) {
        if (y - br < p.top || y + br > p.bot) {
          state = 2;
          if (score > best) best = score;
        }
      }
    }

    while (pipes.length && pipes[0].x + pw < 0) pipes.shift();

    if (y + br > H) {
      y = H - br;
      state = 2;
      if (score > best) best = score;
    }

    if (y - br < 0) {
      y = br;
      v = 0;
    }
  }

  function draw() {
    ctx.fillStyle = "#1b77c8";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#3fbf40";
    for (let p of pipes) {
      ctx.fillRect(p.x, 0, pw, p.top);
      ctx.fillRect(p.x, p.bot, pw, H - p.bot);
    }

    ctx.fillStyle = "#ffeb3b";
    ctx.beginPath();
    ctx.arc(bx, y, br, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";

    if (state === 1) {
      ctx.fillText(score, W / 2, 30);
    }
    if (best > 0 && state !== 1) {
      ctx.fillText("Best: " + best, W / 2, 40);
    }

    if (state === 0) {
      ctx.fillText("Tap to start", W / 2, H / 2);
    } else if (state === 2) {
      ctx.fillText("GAME OVER", W / 2, H / 2 - 10);
      ctx.fillText("Tap to restart", W / 2, H / 2 + 14);
    }
  }

  (function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  })();
</script>
